<!doctype html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HIIT Timer Pro</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="manifest" href="manifest.json" />
        <meta name="theme-color" content="#0a0a0a" />
        <link rel="icon" href="icon.svg" type="image/svg+xml" />
    </head>
    <body>
        <div id="setup-screen">
            <select id="lang-switcher" class="lang-switcher" aria-label="Language / Lingua">
                <option value="it">🇮🇹 Italiano</option>
                <option value="en">🇬🇧 English</option>
            </select>

            <button type="button" class="btn-history" id="btn-history" data-i18n="historyBtn">
                📜 Storico
            </button>

            <h1>HIIT Timer Pro</h1>

            <!-- Selettore Modalità con Preset integrati -->
            <div class="mode-selector">
                <button type="button" class="mode-tab active" data-mode="hiit">
                    HIIT
                </button>
                <button type="button" class="mode-tab" data-mode="tabata">
                    TABATA
                </button>
                <button type="button" class="mode-tab" data-mode="emom">
                    EMOM
                </button>
                <button type="button" class="mode-tab" data-mode="amrap">
                    AMRAP
                </button>
                <button type="button" class="mode-tab" data-mode="fortime">
                    FOR TIME
                </button>
            </div>

            <div class="config-grid">
                <div class="config-row" id="row-rounds">
                    <label>
                        <span class="label-main" data-i18n="roundsLabel">Round totali</span>
                        <span data-i18n="roundsSub">Numero di round totali (scrivibile da tastiera)</span>
                    </label>
                    <div class="stepper">
                        <button id="btn-round-minus">−</button>
                        <input
                            type="number"
                            id="cfg-rounds"
                            min="1"
                            max="30"
                            value="10"
                        />
                        <button id="btn-round-plus">+</button>
                    </div>
                </div>

                <div class="config-row" id="row-prepare">
                    <label>
                        <span class="label-main" data-i18n="prepareLabel">Prepare</span>
                        <span data-i18n="prepareSub">Conto alla rovescia iniziale</span>
                    </label>
                    <div class="stepper">
                        <button data-field="prepare" data-delta="-5">−</button>
                        <input
                            type="text"
                            id="cfg-prepare"
                            data-value="10"
                            inputmode="numeric"
                        />
                        <button data-field="prepare" data-delta="5">+</button>
                    </div>
                </div>

                <div class="config-row" id="row-standard-work">
                    <label>
                        <span class="label-main" id="lbl-work-main">Durata round</span>
                        <span id="lbl-work-sub">Tempo di lavoro (uguale per tutti i round)</span>
                    </label>
                    <div class="stepper">
                        <button data-field="work" data-delta="-5">−</button>
                        <input
                            type="text"
                            id="cfg-work"
                            data-value="20"
                            inputmode="numeric"
                        />
                        <button data-field="work" data-delta="5">+</button>
                    </div>
                </div>

                <div class="config-row" id="row-warning">
                    <label>
                        <span class="label-main" data-i18n="warningLabel">Warning pre-fine</span>
                        <span data-i18n="warningSub">Allarme prima della fine del blocco (mm:ss)</span>
                    </label>
                    <div class="stepper">
                        <button data-field="warning" data-delta="-5">−</button>
                        <input
                            type="text"
                            id="cfg-warning"
                            data-value="5"
                            inputmode="numeric"
                        />
                        <button data-field="warning" data-delta="5">+</button>
                    </div>
                </div>

                <div class="config-row" id="row-rest">
                    <label>
                        <span class="label-main" data-i18n="restLabel">Rest standard</span>
                        <span data-i18n="restSub">Recupero tra i round standard</span>
                    </label>
                    <div class="stepper">
                        <button data-field="rest" data-delta="-5">−</button>
                        <input
                            type="text"
                            id="cfg-rest"
                            data-value="10"
                            inputmode="numeric"
                        />
                        <button data-field="rest" data-delta="5">+</button>
                    </div>
                </div>
            </div>

            <!-- TOGGLE TEMPI DIVERSI PER SET (TEAL STYLE) -->
            <div class="toggle-row" id="row-toggle-advanced">
                <label class="toggle-label-wrap" for="cfg-advanced-toggle">
                    <span style="color:var(--advanced-sets);" data-i18n="advancedToggleLabel">Imposta tempi diversi per ogni set</span>
                    <div class="switch">
                        <input type="checkbox" id="cfg-advanced-toggle" />
                        <span class="slider"></span>
                    </div>
                </label>
            </div>

            <!-- OPZIONI TEMPI DIVERSI (COMPARE SUBITO SOTTO IL TOGGLE RELATIVO) -->
            <div
                class="rounds-list-container"
                id="rounds-inputs-container-wrap"
            >
                <h3 style="color:var(--advanced-sets);" data-i18n="advancedTitle">Personalizza durata singoli Set (mm:ss)</h3>
                <div class="rounds-list" id="rounds-inputs-container"></div>
            </div>

            <!-- TOGGLE RECUPERI EXTRA (PURPLE STYLE) -->
            <div class="toggle-row" id="row-toggle-extra-rest">
                <label class="toggle-label-wrap" for="cfg-extra-rest-toggle">
                    <span style="color:var(--extra-rest);" data-i18n="extraRestToggleLabel">Inserisci recuperi extra programmati</span>
                    <div class="switch">
                        <input type="checkbox" id="cfg-extra-rest-toggle" checked />
                        <span class="slider"></span>
                    </div>
                </label>
            </div>

            <!-- OPZIONI RECUPERI EXTRA (COMPARE SUBITO SOTTO IL TOGGLE RELATIVO) -->
            <div id="extra-rest-inputs-container-wrap">
                <!-- RIGA: REST EXTRA (DURATA) -->
                <div class="config-row" id="row-extra-rest">
                    <label>
                        <span class="label-main" style="color:var(--extra-rest);" data-i18n="extraRestLabel">Rest Extra</span>
                        <span data-i18n="extraRestSub">Durata del recupero lungo speciale (mm:ss)</span>
                    </label>
                    <div class="stepper">
                        <button data-field="extraRest" data-delta="-5">−</button>
                        <input
                            type="text"
                            id="cfg-extraRest"
                            data-value="40"
                            inputmode="numeric"
                        />
                        <button data-field="extraRest" data-delta="5">+</button>
                    </div>
                </div>

                <!-- RIGA: FREQUENZA REST EXTRA -->
                <div class="config-row" id="row-extra-rest-freq">
                    <label>
                        <span class="label-main" style="color:var(--extra-rest);" data-i18n="extraRestFreqLabel">Frequenza Rest Extra</span>
                        <span data-i18n="extraRestFreqSub">Inserisci un Rest Extra ogni X round di lavoro</span>
                    </label>
                    <div class="stepper">
                        <button id="btn-extra-rest-freq-minus">−</button>
                        <input
                            type="number"
                            id="cfg-extraRestFreq"
                            min="0"
                            max="30"
                            value="5"
                            readonly
                        />
                        <button id="btn-extra-rest-freq-plus">+</button>
                    </div>
                </div>
            </div>

            <div class="summary-card" id="row-summary">
                <div class="summary-stat">
                    <div class="val" id="sum-rounds">10</div>
                    <div class="lbl" data-i18n="summaryRoundsLabel">Round</div>
                </div>
                <div class="summary-stat">
                    <div class="val" id="sum-total">—</div>
                    <div class="lbl" data-i18n="summaryTotalLabel">Durata totale</div>
                </div>
            </div>

            <button class="start-btn" id="btn-apply" data-i18n="applyBtn">✓ Applica</button>

            <!-- Segui un allenamento condiviso da un altro dispositivo -->
            <div class="join-box">
                <label class="join-box-label" for="cfg-join-code" data-i18n="joinLabel">Segui un allenamento condiviso</label>
                <div class="join-box-row">
                    <input
                        type="text"
                        id="cfg-join-code"
                        placeholder="CODICE"
                        data-i18n-placeholder="joinPlaceholder"
                        maxlength="6"
                        autocomplete="off"
                        autocapitalize="characters"
                    />
                    <button type="button" id="btn-join" data-i18n="joinBtn">Segui</button>
                </div>
            </div>
        </div>

        <div id="active-screen">
            <!-- Bottone Schermo Intero per Monitor Palestra -->
            <button type="button" class="btn-fullscreen" id="btn-fullscreen" title="Schermo Intero" data-i18n-title="fullscreenTitle">
                <svg viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
            </button>

            <div class="top-left-actions">
                <!-- Mute: azzera/ripristina il volume dei beep, per dispositivo -->
                <button type="button" class="btn-mute" id="btn-mute" title="Disattiva audio">🔊</button>
                <!-- Volume beep: regolazione fine, utile ad es. per attenuare i beep frequenti dell'EMOM -->
                <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" step="5" value="100" aria-label="Volume" />
                <!-- Bottone Condividi: genera un codice per far seguire il timer da un altro dispositivo -->
                <button type="button" class="btn-share" id="btn-share" data-i18n="shareBtn">📡 Condividi</button>
            </div>

            <div class="viewer-banner" id="viewer-banner" data-i18n="viewerBanner">👀 In diretta</div>

            <div class="phase-badge" id="phase-badge">PREPARE</div>

            <!-- Standard Display -->
            <div class="main-display" id="main-display-standard">
                <div class="round-display" id="active-round-box">
                    <div class="round-num" id="round-num">1</div>
                    <div class="round-label" id="round-label">/ 8 round</div>
                </div>

                <div class="display-divider" id="active-divider-box">|</div>

                <div class="timer-display">
                    <div class="time-val" id="time-val">00:10</div>
                    <div class="time-label" id="time-label">tempo</div>
                    <div class="time-cap-subinfo" id="active-timecap-subinfo">
                        Cap: <span id="timecap-target-val">10:00</span>
                    </div>
                </div>
            </div>

            <div class="workout-modifiers-zone" id="active-modifiers-zone">
                <button
                    type="button"
                    class="extratime-btn remove"
                    id="btn-remove-extratime"
                    data-i18n="extratimeMinus"
                >
                    - 1 Min
                </button>
                <button
                    type="button"
                    class="extratime-btn add"
                    id="btn-add-extratime"
                    data-i18n="extratimePlus"
                >
                    + 1 Min
                </button>
            </div>

            <div class="progress-wrap" id="active-progress-wrap">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="hiit-recap-ticker" id="active-hiit-recap">
                <span><span data-i18n="recapWorkLabel">Lavoro:</span> <strong id="rcp-work">—</strong></span>
                <span><span data-i18n="recapRestLabel">Rest:</span> <strong id="rcp-rest">—</strong></span>
                <span><span data-i18n="recapRoundsLabel">Round Totali:</span> <strong id="rcp-rounds">—</strong></span>
                <span><span data-i18n="recapWarningLabel">Warning:</span> <strong id="rcp-warning">—</strong></span>
            </div>

            <!-- Contatore Rep/Giri personale: visibile solo in modalità "Segui", mai sincronizzato -->
            <div class="rep-counter-panel" id="rep-counter-panel">
                <span class="rep-counter-label" data-i18n="repCounterLabel">I tuoi giri / rep</span>
                <div class="stepper">
                    <button type="button" id="btn-rep-minus">−</button>
                    <span class="rep-counter-value" id="rep-counter-value">0</span>
                    <button type="button" id="btn-rep-plus">+</button>
                </div>
            </div>

            <div class="controls">
                <button class="ctrl-btn" id="btn-active-start" data-i18n="startBtn">
                    ▶ Inizia Allenamento
                </button>
                <button class="ctrl-btn" id="btn-pause" style="display: none" data-i18n="pauseBtn">
                    ⏸ Pausa
                </button>
                <button class="ctrl-btn" id="btn-stop" data-i18n="stopBtn">
                    ■ Indietro / Reset
                </button>
            </div>
        </div>

        <div id="finished-overlay">
            <h2 data-i18n="finishedTitle">💪 Fatto!</h2>
            <p id="finished-msg">Allenamento completato</p>
            <button id="btn-done" data-i18n="restartBtn">Ricomincia</button>
        </div>

        <!-- Badge fisso col codice sessione, visibile mentre si condivide il timer -->
        <div class="share-code-badge" id="share-code-badge">
            <span class="share-code-label" data-i18n="codeLabel">Codice</span>
            <span class="share-code-value" id="share-code-value">------</span>
        </div>

        <!-- Modal Storico Allenamenti (solo locale, nessun account) -->
        <div class="history-overlay" id="history-overlay">
            <div class="history-panel">
                <h2 data-i18n="historyModalTitle">📜 Storico allenamenti</h2>
                <div class="history-list" id="history-list"></div>
                <div class="history-actions">
                    <button type="button" id="btn-history-clear" data-i18n="historyClearBtn">Cancella storico</button>
                    <button type="button" id="btn-history-close" data-i18n="historyCloseBtn">Chiudi</button>
                </div>
            </div>
        </div>

        <script type="module" src="app.js"></script>
        <script>
            // Registrazione del Service Worker per il caching offline (PWA)
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker
                        .register("sw.js")
                        .then((reg) => console.log("Service Worker registrato con successo per l'offline.", reg.scope))
                        .catch((err) => console.error("Errore durante la registrazione del Service Worker:", err));
                });
            }
        </script>
    </body>
</html>
